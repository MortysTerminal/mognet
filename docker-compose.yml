services:
  mognet:
    # IMAGE_TAG (stack variable) pins a version, e.g. sha-3ff5943 for a rollback; defaults to latest.
    image: ghcr.io/mortysterminal/mognet:${IMAGE_TAG:-latest}
    container_name: mognet
    restart: unless-stopped

    # ── Hardening ─────────────────────────────────────────────────────────────
    # The root filesystem is read-only. The only writable places are /tmp (memory) and the /data volume.
    # No extra Linux capabilities and no ports.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    volumes:
      # Holds the SQLite database. The image creates /data owned by the non-root user.
      - mognet-data:/data

    environment:
      - Database__Path=/data/mognet.db

      # ── Secrets (set as stack environment variables) ──
      - Discord__BotToken=${DISCORD_BOT_TOKEN}
      - Discord__GuildId=${DISCORD_GUILD_ID}
      - Twitch__ClientId=${TWITCH_CLIENT_ID}
      - Twitch__ClientSecret=${TWITCH_CLIENT_SECRET}

      # Optional: YouTube Data API key, read each time the alerts module starts. Blank means the module
      # refuses to start, so set it before switching the module on.
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}

      # ── Twitch channels: imported once ───────────────────────────────────────
      # The channels below and the Sync__* and Discord__EventLanguage values are read once, at the first start
      # of the schedule module, and stored in the database. After that the database wins: changing these
      # variables has no effect.
      #
      # Set the variables with the exact names below. Only set the slots you need; unset slots are ignored.
      # Indices must be contiguous starting from 0.
      #
      # Example stack variables:
      #   Twitch__Channels__0__Username    = first_channel
      #   Twitch__Channels__0__DisplayName = First Channel
      #   Twitch__Channels__1__Username    = second_channel
      #   Twitch__Channels__1__DisplayName = Second Channel
      #
      # Slots 0-4 are available without editing this file.
      # For slot 5+, add more Twitch__Channels__N__Username / __DisplayName lines below.
      - Twitch__Channels__0__Username
      - Twitch__Channels__0__DisplayName
      - Twitch__Channels__1__Username
      - Twitch__Channels__1__DisplayName
      - Twitch__Channels__2__Username
      - Twitch__Channels__2__DisplayName
      - Twitch__Channels__3__Username
      - Twitch__Channels__3__DisplayName
      - Twitch__Channels__4__Username
      - Twitch__Channels__4__DisplayName

      # ── Optional values, also imported once at the first start ───────────────
      # Discord__EventLanguage    -> "en" (default) or "de"
      # Sync__IntervalMinutes     -> default 30
      # Sync__LookaheadDays       -> default 14
      # Sync__MaxEventsPerChannel -> default 10 (recurring series show only their next occurrence)
      - Discord__EventLanguage
      - Sync__IntervalMinutes
      - Sync__LookaheadDays
      - Sync__MaxEventsPerChannel

    # ── Logging ───────────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mognet-data:
